name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK (R8 + shrink)
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      # En cas d'échec : les erreurs de compilation sont aussi affichées en annotations sur la page du build
      - name: Afficher les erreurs
        if: failure()
        shell: bash
        run: |
          grep -E "^(e: |ERROR:)" build.log | head -10 | while IFS= read -r line; do echo "::error::$line"; done || true

      - uses: actions/upload-artifact@v4
        with:
          name: ChronoWatch-apk
          path: app/build/outputs/apk/release/app-release.apk
